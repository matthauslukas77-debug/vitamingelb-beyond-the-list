<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: Die App darf unter Notch und Home-Indikator laufen,
         die sicheren Bereiche holen wir uns per env() zurück. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E4F2F2" />

    <!-- Vom Home-Bildschirm gestartet läuft die App im Vollbild, ohne Safari-Leisten. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PostFinance" />

    <!-- ?v=2 nur, weil Safari das Home-Bildschirm-Symbol hartnäckig behält:
         Ohne neuen Pfad zeigt ein einmal gespeichertes Lesezeichen weiter das
         alte Symbol, und genau das soll hier ja das PostFinance-Zeichen sein. -->
    <link rel="manifest" href="./manifest.webmanifest?v=2" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg?v=2" />
    <link rel="apple-touch-icon" href="./icon-180.png?v=2" />

    <title>PostFinance</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
